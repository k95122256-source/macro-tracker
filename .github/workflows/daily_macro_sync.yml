name: Daily Macro DB Rolling Sync

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-macro-db:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Fetch FRED API & Roll Daily JSON DB
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_macro_data.py

      - name: Commit & Push Updated Rolling DB
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Macro Rolling DB Bot"
          git add macro_data.json latest_macro.json archive/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "db: daily rolling macro update ($(date -u +'%Y-%m-%d')) [skip ci]" && git push)
